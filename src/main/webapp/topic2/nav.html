<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>側邊導覽列範例</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .sidebar {
        height: 100%;
        width: 250px;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #333;
        padding-top: 20px;
      }
      .sidebar a {
        padding: 15px 20px;
        text-decoration: none;
        font-size: 18px;
        color: white;
        display: block;
      }
      .sidebar a:hover {
        background-color: #575757;
      }
      .content {
        margin-left: 260px; /* 留出側邊欄的空間 */
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <a href="#home">會員管理</a>
      <a href="#services">航線管理</a>
      <a href="#about">機場管理</a>
      <a href="#contact">贈品管理</a>
    </div>

   
  </body>
</html>
